<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Random Picker</title>

<style>
*{
    box-sizing:border-box;
    font-family:'Courier New',Consolas,monospace;
}

body{
    margin:0;
    background:#0a0e1a;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:24px;
}

.header{
    position:fixed;
    top:0;
    left:0;
    right:0;
    text-align:center;
    padding:24px 0 12px;
}

.header .logo{
    display:inline-flex;
    align-items:center;
    gap:12px;
    font-size:32px;
    font-weight:bold;
    letter-spacing:4px;
    color:#3ee6a8;
    text-shadow:0 0 20px rgba(62,230,168,.35);
}

.header .state{
    margin-top:6px;
    font-size:12px;
    letter-spacing:3px;
    color:#5b7a9d;
    text-transform:uppercase;
}

.card{
    width:420px;
    background:#101830;
    border:1px solid #1e2c4a;
    border-radius:16px;
    padding:24px;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
    margin-top:90px;
}

h2{
    margin:0 0 18px;
    text-align:left;
    font-size:16px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:#3ee6a8;
    border-bottom:1px solid #1e2c4a;
    padding-bottom:14px;
}

.info{
    margin:18px 0;
}

.row{
    display:flex;
    margin:14px 0;
}

.label{
    width:90px;
    font-size:12px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:#5b7a9d;
    flex-shrink:0;
    padding-top:2px;
}

.value{
    flex:1;
    color:#dbe8f5;
    word-break:break-word;
}

.value a{
    color:#3ee6a8;
    text-decoration:none;
}

.value a:hover{
    text-decoration:underline;
}

button{
    width:100%;
    padding:12px;
    border:1px solid #1e2c4a;
    border-radius:10px;
    background:transparent;
    color:#8fa8c7;
    font-size:14px;
    letter-spacing:1px;
    cursor:pointer;
    font-family:inherit;
    transition:background .15s,color .15s,border-color .15s;
}

button:hover{
    border-color:#3ee6a8;
    color:#dbe8f5;
}

#btnRandom{
    background:#3ee6a8;
    border:none;
    color:#0a0e1a;
    font-weight:bold;
}

#btnRandom:hover{
    background:#32c88f;
    color:#0a0e1a;
}

.loading{
    text-align:center;
    color:#5b7a9d;
    letter-spacing:2px;
    padding:20px 0;
}
</style>
</head>
<body>

<div class="header">
<div class="logo">🌿 GATHER</div>
<div class="state">State: Picker — Random Select</div>
</div>

<div class="card">

<h2>Random Picker</h2>

<div id="loading" class="loading">
Loading...
</div>

<div id="content" style="display:none">

<div class="info">

<div class="row">
<div class="label">District</div>
<div class="value" id="district"></div>
</div>

<div class="row">
<div class="label">Name</div>
<div class="value" id="name"></div>
</div>

<div class="row">
<div class="label">Path</div>
<div class="value"><a id="path" href="#" target="_blank" rel="noopener"></a></div>
</div>

<div class="row">
<div class="label">Sites</div>
<div class="value" id="sites"></div>
</div>

<div class="row">
<div class="label">State</div>
<div class="value" id="state"></div>
</div>

</div>

<button id="btnRandom">
🎲 Random
</button>

</div>

</div>

<script>

const API_URL = "https://x8ki-letl-twmt.n7.xano.io/api:X6h8irt0/hunt";

let characters = [];
let currentIndex = -1;
let currentItem = null;

async function loadData(){

    try{

        const response = await fetch(API_URL);
        const data = await response.json();

        // Only Gather
        characters = data.filter(item => item.State === "Gather");

        document.getElementById("loading").style.display="none";
        document.getElementById("content").style.display="block";

        randomPick();

    }catch(err){

        document.getElementById("loading").innerHTML =
            "Failed to load data.";

        console.error(err);

    }

}

function randomPick(){

    if(characters.length===0){

        alert("No Hunt data found.");
        return;

    }

    let index;

    do{

        index = Math.floor(Math.random()*characters.length);

    }while(characters.length>1 && index===currentIndex);

    currentIndex = index;

    const item = characters[index];
    currentItem = characters[index];

    document.getElementById("district").textContent = currentItem.District;
    document.getElementById("name").textContent = currentItem.Name;
    document.getElementById("sites").textContent = currentItem.Sites;
    document.getElementById("state").textContent = currentItem.State;

    const pathEl = document.getElementById("path");
    pathEl.textContent = currentItem.Path;
    pathEl.href = currentItem.Path;

}

document
.getElementById("btnRandom")
.addEventListener("click",randomPick);

loadData();

</script>

</body>
</html>
