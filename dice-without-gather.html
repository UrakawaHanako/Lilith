<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lilith</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,500;0,700;1,500&family=Jost:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
  :root{
    --black:#0a0a0c;
    --panel:#131316;
    --panel-2:#1a1a1e;
    --hairline:#2b2b30;
    --pink:#ff2d78;
    --pink-soft:#ff8fb8;
    --pink-dim:#5c1c37;
    --white:#f5f3f4;
    --grey:#8b8890;
    --font-display:'Bodoni Moda', serif;
    --font-body:'Jost', sans-serif;
    --font-mono:'Space Mono', monospace;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--black);
    color:var(--white);
    font-family:var(--font-body);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:32px 16px;
  }

  /* faint vertical studio-light gradient */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
      radial-gradient(700px 500px at 50% -8%, rgba(255,45,120,0.10), transparent 60%),
      radial-gradient(600px 400px at 100% 100%, rgba(255,45,120,0.05), transparent 60%);
    pointer-events:none;
  }

  .card{
    position:relative;
    width:420px;
    max-width:100%;
    background:var(--panel);
    border:1px solid var(--hairline);
  }

  /* comp-card style corner tag */
  .tag{
    position:absolute;
    top:0;
    left:0;
    background:var(--pink);
    color:var(--black);
    font-family:var(--font-mono);
    font-size:10.5px;
    font-weight:700;
    letter-spacing:0.14em;
    text-transform:uppercase;
    padding:6px 12px;
  }

  .head{
    padding:44px 32px 22px;
    text-align:center;
    border-bottom:1px solid var(--hairline);
  }
  .eyebrow{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:0.32em;
    text-transform:uppercase;
    color:var(--pink-soft);
    margin:0 0 14px;
  }
  h1{
    font-family:var(--font-display);
    font-style:italic;
    font-weight:500;
    font-size:52px;
    letter-spacing:0.01em;
    margin:0 0 6px;
    color:var(--white);
  }
  .sub{
    font-family:var(--font-mono);
    font-size:10.5px;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color:var(--grey);
    margin:0;
  }

  #loading{
    padding:60px 32px;
    text-align:center;
    font-family:var(--font-mono);
    font-size:12px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--grey);
  }

  #content{
    display:none;
  }

  .info{
    padding:28px 32px 8px;
  }

  .row{
    display:flex;
    gap:16px;
    padding:13px 0;
    border-bottom:1px solid var(--hairline);
  }
  .row:last-child{border-bottom:none;}

  .label{
    width:78px;
    flex:none;
    font-family:var(--font-mono);
    font-size:10px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--pink-soft);
    padding-top:2px;
  }
  .value{
    flex:1;
    font-size:15px;
    color:var(--white);
    word-break:break-word;
    line-height:1.5;
  }
  .value:empty::after{
    content:"—";
    color:var(--grey);
  }

  .path-link{
    color:var(--pink-soft);
    text-decoration:none;
    border-bottom:1px dotted var(--pink-dim);
    word-break:break-all;
  }
  .path-link:hover{
    color:var(--pink);
    border-bottom-color:var(--pink);
  }
  .path-link:empty::after{
    content:"—";
    color:var(--grey);
    border-bottom:none;
  }

  .actions{
    padding:24px 32px 32px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  button{
    width:100%;
    padding:15px;
    border:1px solid var(--pink);
    border-radius:0;
    background:transparent;
    color:var(--pink-soft);
    font-family:var(--font-mono);
    font-size:12px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    cursor:pointer;
    transition:background .18s, color .18s;
  }
  button:hover{
    background:var(--pink);
    color:var(--black);
  }

  #btnOpen{
    border-color:var(--hairline);
    color:var(--grey);
  }
  #btnOpen:hover{
    border-color:var(--white);
    background:transparent;
    color:var(--white);
  }

  .foot{
    text-align:center;
    font-family:var(--font-mono);
    font-size:9.5px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--hairline);
    padding:0 32px 26px;
  }

  @media (max-width:480px){
    h1{font-size:42px;}
    .head{padding:36px 24px 20px;}
    .info{padding:24px 24px 4px;}
    .actions{padding:20px 24px 26px;}
  }
</style>
</head>
<body>

<div class="card">
  <div class="tag">Casting File</div>

  <div class="head">
    <p class="eyebrow">Agency Draw</p>
    <h1>Lilith</h1>
    <p class="sub">One name, pulled at random</p>
  </div>

  <div id="loading">Reading the ledger…</div>

  <div id="content">

    <div class="info">
      <div class="row">
        <div class="label">District</div>
        <div class="value" id="district"></div>
      </div>
      <div class="row">
        <div class="label">Name</div>
        <div class="value" id="name"></div>
      </div>
      <div class="row">
        <div class="label">Path</div>
        <div class="value"><a class="path-link" id="path" href="#" target="_blank" rel="noopener"></a></div>
      </div>
      <div class="row">
        <div class="label">Sites</div>
        <div class="value" id="sites"></div>
      </div>
      <div class="row">
        <div class="label">State</div>
        <div class="value" id="state"></div>
      </div>
    </div>

    <div class="actions">
      <button id="btnRandom">Draw Again</button>
      <button id="btnOpen">Open File</button>
    </div>

    <p class="foot">Lilith Registry · No. —</p>

  </div>

</div>

<script>

// Left blank on purpose — point this at your data source when ready.
const API_URL = "https://x8ki-letl-twmt.n7.xano.io/api:X6h8irt0/hunt";
const DETAIL_URL = "view.html?id=";
// or
// const DETAIL_URL = "https://example.com/view.html?id=";

let characters = [];
let currentIndex = -1;
let currentItem = null;

function isSafeUrl(url){
    try{
        const u = new URL(url, window.location.href);
        return u.protocol === "http:" || u.protocol === "https:";
    }catch(e){
        return false;
    }
}

async function loadData(){

    try{

        if(!API_URL){
            document.getElementById("loading").textContent =
                "No data source configured yet.";
            return;
        }

        const response = await fetch(API_URL);
        const data = await response.json();

        // Skip Gather
        characters = data.filter(item => item.State !== "Gather");

        document.getElementById("loading").style.display = "none";
        document.getElementById("content").style.display = "block";

        randomPick();

    }catch(err){

        document.getElementById("loading").textContent =
            "Couldn't reach the ledger.";

        console.error(err);

    }

}

function randomPick(){

    if(characters.length === 0){
        alert("No entries found.");
        return;
    }

    let index;

    do{
        index = Math.floor(Math.random() * characters.length);
    }while(characters.length > 1 && index === currentIndex);

    currentIndex = index;
    currentItem = characters[index];

    document.getElementById("district").textContent = currentItem.District;
    document.getElementById("name").textContent = currentItem.Name;
    document.getElementById("sites").textContent = currentItem.Sites;
    document.getElementById("state").textContent = currentItem.State;

    const pathEl = document.getElementById("path");
    const pathUrl = isSafeUrl(currentItem.Path) ? currentItem.Path : "";
    pathEl.textContent = currentItem.Path || "";
    pathEl.href = pathUrl || "#";
    if(!pathUrl){
        pathEl.removeAttribute("target");
        pathEl.style.pointerEvents = "none";
    }else{
        pathEl.setAttribute("target", "_blank");
        pathEl.style.pointerEvents = "";
    }

    document.querySelector(".foot").textContent =
        "Lilith Registry · No. " + String(currentItem.id ?? "—").padStart(3, "0");

}

document.getElementById("btnRandom").addEventListener("click", randomPick);

document.getElementById("btnOpen").addEventListener("click", () => {
    if(!currentItem) return;
    window.open(DETAIL_URL + currentItem.id, "_blank");
});

loadData();

</script>

</body>
</html>
